model:
  kernel_size: 3
  num_layers: 7

training:
  batch_size: 6
  learning_rate: 5e-05
  epochs: 30
  alpha: 0.08
  early_stopping_patience: 8
  val_split: 0.10
  split_seed: 123
  use_gpu: true

paths:
  h5_files:
    - "./data/converted_h5/MS30013_txt.h5"
    - "./data/converted_h5/MS30015_txt.h5"
    - "./data/converted_h5/MS30017_txt.h5"
    - "./data/converted_h5/MS30019_txt.h5"
  output_dir: "./results_ms_txt_quick4_v8"
  csv_subdir: "csv"

data:
  samples_per_file: 256
  crop_size: [192, 192]
  input_channel: 0
  input_key: "raw_channels"
  target_key: "spectrum"
  normalize: true
  add_noise: true
  noise_std: 0.035
  stripe_noise_prob: 0.30
  stripe_strength: 0.08
  blur_prob: 0.20
  blur_sigma: 0.80
  noise_energy_method: "percentile"
  noise_energy_percentile: 5.0
  noise_energy_smooth: 7
  noise_min_run: 12
